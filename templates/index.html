<!doctype html>
<html lang="it" id="html-root">
<head>
<meta charset="utf-8">
<title>Google Photos Takeout Fixer</title>
<style>
  :root {
    color-scheme: light dark;

    /* Superfici: valori esatti di NSColor.windowBackgroundColor /
       controlBackgroundColor / separatorColor letti da AppKit, così la
       titlebar nativa (che pywebview colora con lo stesso windowBackgroundColor
       di sistema) si fonde senza cuciture con il contenuto della pagina. */
    --window-bg: #ececec;
    --group-bg: #ffffff;
    --control-bg: #ffffff;
    --separator: rgba(0, 0, 0, 0.1);
    --hairline: rgba(0, 0, 0, 0.08);

    /* Testo: valori esatti di labelColor / secondaryLabelColor / tertiaryLabelColor */
    --label: rgba(0, 0, 0, 0.85);
    --label-secondary: rgba(0, 0, 0, 0.5);
    --label-tertiary: rgba(0, 0, 0, 0.26);

    /* Colori di sistema */
    --accent: #007aff;
    --accent-pressed: #0064d6;
    --green: #28a745;
    --orange: #d98a10;
    --red: #e0332f;

    --radius-window: 10px;
    --radius-control: 6px;
    --radius-group: 9px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --window-bg: #323232;
      --group-bg: #1e1e1e;
      --control-bg: #2c2c2e;
      --separator: rgba(255, 255, 255, 0.1);
      --hairline: rgba(255, 255, 255, 0.08);

      --label: rgba(255, 255, 255, 0.85);
      --label-secondary: rgba(255, 255, 255, 0.55);
      --label-tertiary: rgba(255, 255, 255, 0.25);

      --accent: #0a84ff;
      --accent-pressed: #0060c4;
      --green: #32d74b;
      --orange: #ff9f0a;
      --red: #ff453a;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--window-bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  input, button { user-select: text; }
  button { user-select: none; }

  /* 20pt di margine finestra su tutti i lati, per le HIG di layout */
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px;
  }

  .title-block {
    margin-bottom: 20px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  p.subtitle {
    color: var(--label-secondary);
    margin: 0;
    font-size: 12.5px;
    line-height: 1.5;
  }

  .banner {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 12px;
    border-radius: var(--radius-control);
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 16px;
    background: color-mix(in srgb, var(--red) 12%, transparent);
    color: var(--label);
    border: 1px solid color-mix(in srgb, var(--red) 25%, transparent);
  }
  .banner code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: color-mix(in srgb, var(--red) 12%, transparent);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11.5px;
  }

  /* Group box: 16pt di margine interno su tutti i lati */
  .group-box {
    background: var(--group-bg);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-group);
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.03);
  }

  .field {
    margin-bottom: 16px;
  }
  .field:last-child { margin-bottom: 0; }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--label);
    margin-bottom: 6px;
  }

  .field-hint {
    font-size: 11px;
    color: var(--label-tertiary);
    margin-top: 6px;
    line-height: 1.4;
  }

  .path-row {
    display: flex;
    gap: 8px;
  }
  .path-row input { flex: 1; min-width: 0; }

  input[type="text"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--separator);
    border-radius: var(--radius-control);
    font-size: 13px;
    background: var(--control-bg);
    color: var(--label);
  }
  input[type="text"]::placeholder { color: var(--label-tertiary); }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  /* Il percorso si sceglie solo dal Finder: il campo è di sola lettura e
     cliccabile, niente cursore lampeggiante che inviti a digitare a mano. */
  input[type="text"][readonly] {
    cursor: pointer;
    caret-color: transparent;
    text-overflow: ellipsis;
  }

  /* Bottone "Scegli…": bordered, stessa altezza del campo */
  .btn {
    -webkit-appearance: none;
    appearance: none;
    height: 28px;
    padding: 0 14px;
    border-radius: var(--radius-control);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--separator);
    background: var(--control-bg);
    color: var(--label);
    white-space: nowrap;
  }
  .btn:hover { background: color-mix(in srgb, var(--label) 6%, var(--control-bg)); }
  .btn:active { background: color-mix(in srgb, var(--label) 12%, var(--control-bg)); }

  /* Bottone primario in stile "default button" macOS */
  .btn-primary {
    -webkit-appearance: none;
    appearance: none;
    height: 28px;
    padding: 0 18px;
    border: none;
    border-radius: var(--radius-control);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.05);
  }
  .btn-primary:hover { background: color-mix(in srgb, black 8%, var(--accent)); }
  .btn-primary:active { background: var(--accent-pressed); }
  .btn-primary:disabled {
    background: color-mix(in srgb, var(--label-tertiary) 55%, var(--window-bg));
    color: var(--label-tertiary);
    cursor: default;
  }

  .stepper-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .stepper-row .field-label { margin-bottom: 0; }
  input[type="number"] {
    -webkit-appearance: none;
    appearance: none;
    width: 56px;
    height: 24px;
    padding: 0 8px;
    border: 1px solid var(--separator);
    border-radius: var(--radius-control);
    font-size: 13px;
    text-align: center;
    background: var(--control-bg);
    color: var(--label);
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 30%, transparent);
  }

  /* Checkbox nativa macOS: quadrato arrotondato con segno di spunta */
  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  input[type="checkbox"] {
    -webkit-appearance: none;
    appearance: none;
    width: 15px;
    height: 15px;
    min-width: 15px;
    margin: 1px 0 0;
    border: 1px solid var(--separator);
    border-radius: 4px;
    background: var(--control-bg);
    cursor: pointer;
    position: relative;
  }
  input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 4.5px;
    top: 1.5px;
    width: 4px;
    height: 8px;
    border: solid white;
    border-width: 0 1.6px 1.6px 0;
    transform: rotate(45deg);
  }
  input[type="checkbox"]:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .checkbox-row label {
    font-size: 12.5px;
    color: var(--label);
    line-height: 1.4;
    cursor: pointer;
  }

  .actions-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
  }

  hr.separator {
    border: none;
    border-top: 1px solid var(--hairline);
    margin: 16px 0;
  }

  .status-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .status-badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-badge.running,
  .status-badge.pending { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .status-badge.done { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
  .status-badge.error { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
  .status-badge.scanning { background: color-mix(in srgb, var(--orange) 15%, transparent); color: var(--orange); }

  .progress-outer {
    background: var(--separator);
    border-radius: 999px;
    height: 6px;
    overflow: hidden;
  }
  .progress-inner {
    background: var(--accent);
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .stat {
    background: var(--window-bg);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-control);
    padding: 8px 10px;
  }
  .stat .num { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-size: 10.5px; color: var(--label-secondary); margin-top: 1px; }
  .stat.errors .num { color: var(--red); }
  .stat.missing .num { color: var(--orange); }
  .stat.done .num { color: var(--green); }

  #log {
    background: color-mix(in srgb, black 4%, var(--window-bg));
    border: 1px solid var(--hairline);
    color: var(--label-secondary);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.6;
    padding: 10px 12px;
    border-radius: var(--radius-control);
    height: 200px;
    overflow-y: auto;
    margin-top: 14px;
    white-space: pre-wrap;
    display: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-block">
    <h1>Google Photos Takeout Fixer</h1>
    <p class="subtitle" data-i18n="subtitle"></p>
  </div>

  <div class="banner" id="exiftoolBanner" style="display:none">
    <span>⚠️</span>
    <span data-i18n-html="exiftoolMissing"></span>
  </div>

  <div class="group-box">
    <div class="field">
      <label class="field-label" for="input_dir" data-i18n="inputLabel"></label>
      <div class="path-row">
        <input type="text" id="input_dir" readonly onclick="pickFolder('input_dir')">
        <button type="button" class="btn" onclick="pickFolder('input_dir')" data-i18n="choose"></button>
      </div>
      <div class="field-hint" data-i18n="inputHint"></div>
    </div>

    <div class="field">
      <label class="field-label" for="output_dir" data-i18n="outputLabel"></label>
      <div class="path-row">
        <input type="text" id="output_dir" readonly onclick="pickFolder('output_dir')">
        <button type="button" class="btn" onclick="pickFolder('output_dir')" data-i18n="choose"></button>
      </div>
      <div class="field-hint" data-i18n="outputHint"></div>
    </div>

    <hr class="separator">

    <div class="field">
      <div class="stepper-row">
        <label class="field-label" for="jobs" data-i18n="jobsLabel"></label>
        <input type="number" id="jobs" value="4" min="1" max="16">
      </div>
      <div class="field-hint" data-i18n="jobsHint"></div>
    </div>

    <div class="field">
      <div class="checkbox-row">
        <input type="checkbox" id="dry_run">
        <label for="dry_run" data-i18n="dryRun"></label>
      </div>
    </div>

    <div class="actions-row">
      <button id="startBtn" class="btn-primary" onclick="startJob()" data-i18n="start"></button>
    </div>
  </div>

  <div class="group-box" id="statusArea" style="display:none">
    <div class="status-header">
      <span id="statusBadge" class="status-badge"></span>
    </div>
    <div class="progress-outer"><div class="progress-inner" id="progressBar"></div></div>

    <div class="stats">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl" data-i18n="statTotal"></div></div>
      <div class="stat done"><div class="num" id="statProcessed">0</div><div class="lbl" data-i18n="statProcessed"></div></div>
      <div class="stat missing"><div class="num" id="statMissing">0</div><div class="lbl" data-i18n="statMissing"></div></div>
      <div class="stat errors"><div class="num" id="statErrors">0</div><div class="lbl" data-i18n="statErrors"></div></div>
    </div>

    <div id="log"></div>

    <div class="field-hint" id="summaryNote" style="display:none; margin-top:14px"></div>
  </div>
</div>

<script>
const I18N = {
  it: {
    subtitle: "Ripristina data, GPS e descrizione nei file esportati da Google Foto, leggendoli dai JSON di Takeout.",
    exiftoolMissing: 'exiftool non è stato trovato nel PATH. Installalo con <code>brew install exiftool</code> prima di continuare.',
    inputLabel: "Cartella Takeout (input)",
    inputHint: "Percorso della cartella estratta da Google Takeout.",
    outputLabel: "Cartella di output",
    outputHint: "I file verranno copiati qui, organizzati per anno/mese. L'originale non viene toccato.",
    choose: "Scegli…",
    choosePlaceholder: "Scegli una cartella…",
    jobsLabel: "Worker paralleli",
    jobsHint: "Quanti file elaborare contemporaneamente. Su un disco esterno meccanico (non SSD) un valore alto può rallentare invece che velocizzare: 2-4 è spesso il punto ottimale, su SSD puoi salire tranquillamente.",
    dryRun: "Dry run — simula senza copiare o modificare nulla",
    start: "Avvia elaborazione",
    starting: "Elaborazione in corso…",
    statTotal: "Totali",
    statProcessed: "Processati",
    statMissing: "Senza JSON",
    statErrors: "Errori",
    statusLabels: {pending: 'In attesa', scanning: 'Scansione in corso', running: 'Elaborazione in corso', done: 'Completato', error: 'Errore'},
    missingDirsAlert: "Inserisci sia la cartella di input che quella di output.",
    commErrorAlert: "Errore di comunicazione con il server: ",
    errorAlert: "Errore: ",
    pickFolderError: "Impossibile aprire il selettore di cartelle: ",
    pickFolderUnavailable: "Il selettore nativo è disponibile solo nell'app desktop.",
    summaryMissing: "{n} file non avevano un JSON di metadati esportato da Google (normale, non un errore): copiati comunque, senza data/GPS aggiornati.",
    summaryErrors: "{n} file hanno avuto un problema nella scrittura dei metadati che non è stato possibile recuperare automaticamente: dettagli in errors.log nella cartella di output.",
    summaryLink: "Guida completa (FAQ)",
  },
  en: {
    subtitle: "Restores date, GPS, and description in files exported from Google Photos, reading them from the Takeout JSON files.",
    exiftoolMissing: 'exiftool was not found in PATH. Install it with <code>brew install exiftool</code> before continuing.',
    inputLabel: "Takeout folder (input)",
    inputHint: "Path to the extracted Google Takeout folder.",
    outputLabel: "Output folder",
    outputHint: "Files will be copied here, organized by year/month. The original is not modified.",
    choose: "Choose…",
    choosePlaceholder: "Choose a folder…",
    jobsLabel: "Parallel workers",
    jobsHint: "How many files to process at the same time. On a mechanical external drive (not SSD) a high value can slow things down instead of speeding them up: 2-4 is usually the sweet spot, on SSD you can safely go higher.",
    dryRun: "Dry run — simulate without copying or modifying anything",
    start: "Start processing",
    starting: "Processing…",
    statTotal: "Total",
    statProcessed: "Processed",
    statMissing: "Missing JSON",
    statErrors: "Errors",
    statusLabels: {pending: 'Pending', scanning: 'Scanning', running: 'Processing', done: 'Done', error: 'Error'},
    missingDirsAlert: "Please select both the input and output folders.",
    commErrorAlert: "Server communication error: ",
    errorAlert: "Error: ",
    pickFolderError: "Could not open the folder picker: ",
    pickFolderUnavailable: "The native picker is only available in the desktop app.",
    summaryMissing: "{n} file{s} had no metadata JSON exported by Google (normal, not an error): copied anyway, without updated date/GPS.",
    summaryErrors: "{n} file{s} had a metadata-writing problem that couldn't be recovered automatically: details in errors.log in the output folder.",
    summaryLink: "Full guide (FAQ)",
  },
};

const README_FAQ_URL = "https://github.com/MEPoss/Google-Photos-Takeout-Fixer#faq-e-risoluzione-problemi";

function detectLang() {
  const nav = (navigator.language || navigator.userLanguage || "en").toLowerCase();
  return nav.startsWith("it") ? "it" : "en";
}

const LANG = detectLang();
const T = I18N[LANG];

function applyTranslations() {
  document.getElementById("html-root").setAttribute("lang", LANG);
  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    el.textContent = T[el.getAttribute("data-i18n")];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
    el.innerHTML = T[el.getAttribute("data-i18n-html")];
  });
  document.getElementById("input_dir").placeholder = T.choosePlaceholder;
  document.getElementById("output_dir").placeholder = T.choosePlaceholder;
}

applyTranslations();

let pollTimer = null;
let pywebviewReady = false;

window.addEventListener('pywebviewready', function () {
  pywebviewReady = true;
});

fetch('/api/exiftool-status')
  .then(r => r.json())
  .then(data => {
    if (!data.installed) {
      document.getElementById('exiftoolBanner').style.display = 'flex';
    }
  })
  .catch(() => {});

async function pickFolder(inputId) {
  if (window.pywebview && window.pywebview.api && pywebviewReady) {
    try {
      const path = await window.pywebview.api.pick_folder();
      if (path) {
        document.getElementById(inputId).value = path;
      }
    } catch (err) {
      alert(T.pickFolderError + err);
    }
  } else {
    alert(T.pickFolderUnavailable);
  }
}

function startJob() {
  const input_dir = document.getElementById('input_dir').value.trim();
  const output_dir = document.getElementById('output_dir').value.trim();
  const dry_run = document.getElementById('dry_run').checked;
  const jobs = parseInt(document.getElementById('jobs').value, 10) || 4;

  if (!input_dir || !output_dir) {
    alert(T.missingDirsAlert);
    return;
  }

  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = T.starting;
  document.getElementById('statusArea').style.display = 'block';
  document.getElementById('log').style.display = 'block';
  document.getElementById('log').textContent = '';
  document.getElementById('summaryNote').style.display = 'none';

  fetch('/api/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({input_dir, output_dir, dry_run, jobs, lang: LANG})
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      btn.disabled = false;
      btn.textContent = T.start;
      return;
    }
    pollTimer = setInterval(() => pollStatus(data.job_id), 800);
  })
  .catch(err => {
    alert(T.commErrorAlert + err);
    btn.disabled = false;
    btn.textContent = T.start;
  });
}

function pollStatus(jobId) {
  fetch('/api/status/' + jobId + '?lang=' + LANG)
    .then(r => r.json())
    .then(data => {
      if (data.error) return;

      const badge = document.getElementById('statusBadge');
      badge.className = 'status-badge ' + data.state;
      badge.textContent = T.statusLabels[data.state] || data.state;

      document.getElementById('statTotal').textContent = data.total;
      document.getElementById('statProcessed').textContent = data.processed;
      document.getElementById('statMissing').textContent = data.missing_metadata;
      document.getElementById('statErrors').textContent = data.errors;

      const pct = data.total > 0 ? Math.round((data.processed / data.total) * 100) : 0;
      document.getElementById('progressBar').style.width = pct + '%';

      const logEl = document.getElementById('log');
      logEl.textContent = data.log_tail.join('\n');
      logEl.scrollTop = logEl.scrollHeight;

      if (data.state === 'done' || data.state === 'error') {
        clearInterval(pollTimer);
        const btn = document.getElementById('startBtn');
        btn.disabled = false;
        btn.textContent = T.start;
        if (data.state === 'error' && data.error_message) {
          alert(T.errorAlert + data.error_message);
        }
        if (data.state === 'done') {
          showSummaryNote(data.missing_metadata, data.errors);
        }
      }
    });
}

function showSummaryNote(missingCount, errorsCount) {
  const note = document.getElementById('summaryNote');
  if (!missingCount && !errorsCount) {
    note.style.display = 'none';
    return;
  }
  let html = '';
  if (missingCount) {
    html += '<div>' + T.summaryMissing.replace('{n}', missingCount).replace('{s}', missingCount === 1 ? '' : 's') + '</div>';
  }
  if (errorsCount) {
    html += '<div style="margin-top:4px">' + T.summaryErrors.replace('{n}', errorsCount).replace('{s}', errorsCount === 1 ? '' : 's') + '</div>';
  }
  html += '<div style="margin-top:6px"><a href="' + README_FAQ_URL + '" target="_blank" rel="noopener">' + T.summaryLink + ' ↗</a></div>';
  note.innerHTML = html;
  note.style.display = 'block';
}
</script>
</body>
</html>
