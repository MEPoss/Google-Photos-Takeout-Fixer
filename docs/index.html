<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #0b0b0c;
    --muted: #6a6a70;
    --faint: #9a9aa2;
    --hairline: rgba(0, 0, 0, 0.09);
    --card: #fafafa;
    --chip: #ffffff;
    --btn-bg: #0b0b0c;
    --btn-text: #ffffff;
    --code-bg: #0f0f11;
    --code-text: #e9e9ec;
    --code-dim: #7d7d86;
    --green: #1a8f3c;
    --green-bg: #e4f5ea;
    --link: #0b0b0c;
    --shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.28), 0 8px 20px -8px rgba(0, 0, 0, 0.16);
  }
  :root[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0c;
      --text: #f3f3f5;
      --muted: #a0a0a8;
      --faint: #6f6f78;
      --hairline: rgba(255, 255, 255, 0.11);
      --card: #131315;
      --chip: #131315;
      --btn-bg: #f3f3f5;
      --btn-text: #0b0b0c;
      --code-bg: #17171a;
      --code-text: #ececf0;
      --code-dim: #77777f;
      --green: #4fd073;
      --green-bg: rgba(79, 208, 115, 0.14);
      --link: #f3f3f5;
      --shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7), 0 8px 20px -8px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0b0c;
    --text: #f3f3f5;
    --muted: #a0a0a8;
    --faint: #6f6f78;
    --hairline: rgba(255, 255, 255, 0.11);
    --card: #131315;
    --chip: #131315;
    --btn-bg: #f3f3f5;
    --btn-text: #0b0b0c;
    --code-bg: #17171a;
    --code-text: #ececf0;
    --code-dim: #77777f;
    --green: #4fd073;
    --green-bg: rgba(79, 208, 115, 0.14);
    --link: #f3f3f5;
    --shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7), 0 8px 20px -8px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "system-ui", "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  img { max-width: 100%; display: block; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-inline: 24px; }
  section { padding-block: 56px; }

  /* ---------- Nav ---------- */
  header.nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
  }
  .nav-inner { display: flex; align-items: center; gap: 28px; height: 68px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 400; text-decoration: none; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .nav-links { display: flex; gap: 28px; margin-left: auto; }
  .nav-links a { text-decoration: none; color: var(--muted); font-size: 14.5px; }
  .nav-links a:hover { color: var(--text); }
  .lang {
    display: inline-flex; border: 1px solid var(--hairline); border-radius: 9px; padding: 3px;
  }
  .lang button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px;
    padding: 4px 11px; border-radius: 6px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 0 0 1px var(--hairline); }
  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
    border: 1px solid var(--hairline); border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text); background: var(--card); }
  .back-portfolio {
    display: none; align-items: center; gap: 6px; color: var(--muted); text-decoration: none;
    font-size: 14px; padding: 7px 11px 7px 8px; border-radius: 9px; margin-left: -8px;
  }
  .back-portfolio:hover { color: var(--text); background: var(--card); }
  .back-portfolio svg { width: 16px; height: 16px; flex: none; }
  .back-sep { display: none; width: 1px; height: 22px; background: var(--hairline); }
  html.embedded .back-portfolio { display: inline-flex; }
  html.embedded .back-sep { display: block; }
  .theme-toggle svg { width: 17px; height: 17px; }
  .theme-toggle .i-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .i-sun { display: block; }
  :root[data-theme="dark"] .theme-toggle .i-moon { display: none; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    font-size: 14.5px; font-weight: 500; padding: 10px 18px; border-radius: 10px;
    border: 1px solid var(--hairline); background: var(--chip); color: var(--text);
    cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: var(--card); }
  .btn.primary { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }
  .btn.primary:hover { opacity: 0.88; background: var(--btn-bg); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .nav .btn.primary { padding: 9px 16px; }

  /* ---------- Hero ---------- */
  .hero { padding-top: 40px; padding-bottom: 48px; }
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 56px; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); margin-bottom: 22px;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .pill #verLabel { font-weight: 500; color: var(--text); }
  .pill .tag {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500;
    color: var(--green); background: var(--green-bg); padding: 3px 9px; border-radius: 999px;
  }
  h1 {
    font-size: clamp(38px, 5.4vw, 60px); line-height: 1.04; letter-spacing: -0.025em;
    margin: 0 0 22px; font-weight: 500;
  }
  .lede { font-size: 17.5px; color: var(--muted); max-width: 30em; margin: 0 0 28px; }
  .code {
    display: flex; align-items: flex-start; gap: 12px; background: var(--code-bg); color: var(--code-text);
    border-radius: 10px; padding: 13px 16px; font-size: 13px; max-width: 580px; margin-bottom: 18px;
  }
  .code .prompt { color: var(--code-dim); user-select: none; }
  .code code { flex: 1; min-width: 0; white-space: normal; overflow-wrap: anywhere; line-height: 1.55; }
  /* Il riquadro è scuro in entrambi i temi: i colori dei token sono fissi. */
  .code .tok-cmd  { color: #7ee787; }
  .code .tok-sub  { color: #79c0ff; }
  .code .tok-path { color: #ffc27a; }
  .code .tok-glob { color: #ff7b72; }
  .code button {
    flex: none; border: 0; background: transparent; color: var(--code-dim); font: inherit; font-size: 12.5px;
    cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
  }
  .code button:hover { color: var(--code-text); }
  .cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .fineprint { font-size: 12.5px; color: var(--faint); max-width: 36em; }

  /* macOS window frame around the screenshot */
  .window {
    background: #ececec; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
    border: 1px solid rgba(0, 0, 0, 0.12);
  }
  .window .bar { display: flex; gap: 8px; padding: 12px 14px; background: #ececec; }
  .window .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .window .bar i:nth-child(1) { background: #ff5f57; }
  .window .bar i:nth-child(2) { background: #febc2e; }
  .window .bar i:nth-child(3) { background: #28c840; }
  .window img { width: 100%; height: auto; }
  .window img[hidden] { display: none; }

  /* ---------- Generic section bits ---------- */
  .eyebrow { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
  h2 { font-size: 28px; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 22px; font-weight: 500; }
  .about p { color: var(--muted); font-size: 16.5px; margin: 0; max-width: 62em; }
  .about p b { color: var(--text); font-weight: 500; }
  .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .head-row a { font-size: 14px; color: var(--muted); text-decoration: none; white-space: nowrap; margin-bottom: 22px; }
  .head-row a:hover { color: var(--text); }

  /* features */
  .features { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--hairline); border-radius: 12px; background: var(--card); overflow: hidden; }
  .features.second { margin-top: 14px; }
  .feature { padding: 22px 22px 26px; border-left: 1px solid var(--hairline); }
  .feature:first-child { border-left: 0; }
  .feature .n { font-size: 11.5px; color: var(--faint); margin-bottom: 18px; display: block; }
  .feature h3 { font-size: 15.5px; margin: 0 0 8px; font-weight: 500; }
  .feature p { font-size: 13.5px; color: var(--muted); margin: 0; line-height: 1.55; }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip { font-size: 13px; padding: 5px 12px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--chip); }
  .note { color: var(--muted); font-size: 14.5px; margin-top: 18px; max-width: 52em; }

  /* steps */
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .step { border: 1px solid var(--hairline); background: var(--card); border-radius: 12px; padding: 22px; }
  .step .n { font-size: 11.5px; color: var(--faint); display: block; margin-bottom: 14px; }
  .step h3 { font-size: 15.5px; margin: 0 0 8px; font-weight: 500; }
  .step p { margin: 0; font-size: 13.5px; color: var(--muted); }

  /* open source box */
  .box {
    border: 1px solid var(--hairline); background: var(--card); border-radius: 12px; padding: 22px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  }
  .box p { margin: 0; color: var(--muted); font-size: 15px; max-width: 46em; }
  .box p b { color: var(--text); }

  /* changelog */
  .releases { border: 1px solid var(--hairline); border-radius: 12px; background: var(--card); overflow: hidden; }
  .release { display: grid; grid-template-columns: 170px 1fr; gap: 24px; padding: 22px 24px; border-top: 1px solid var(--hairline); }
  .release:first-child { border-top: 0; }
  .release .ver { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .release .ver .latest { font-size: 10px; letter-spacing: 0.06em; color: var(--green); background: var(--green-bg); padding: 2px 7px; border-radius: 5px; font-weight: 500; }
  .release .date { font-size: 12px; color: var(--faint); margin-top: 4px; display: block; text-transform: uppercase; letter-spacing: 0.04em; }
  .release h3 { margin: 0 0 6px; font-size: 15.5px; font-weight: 500; }
  .release p { margin: 0; font-size: 14px; color: var(--muted); }

  /* faq */
  .faq details { border: 1px solid var(--hairline); background: var(--card); border-radius: 10px; margin-bottom: 10px; }
  .faq summary {
    list-style: none; cursor: pointer; padding: 17px 20px; font-size: 15px; font-weight: 500;
    display: flex; justify-content: space-between; gap: 16px; align-items: center;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; color: var(--faint); font-size: 18px; line-height: 1; transition: transform 0.15s ease; flex: none; }
  .faq details[open] summary::after { transform: rotate(45deg); }
  .faq .a { padding: 0 20px 18px; color: var(--muted); font-size: 14.5px; max-width: 60em; }
  .faq .a p { margin: 0 0 10px; }
  .faq .a p:last-child { margin-bottom: 0; }
  .faq .a code { font-size: 12.5px; background: var(--code-bg); color: var(--code-text); padding: 2px 7px; border-radius: 5px; }

  /* footer */
  footer { border-top: 1px solid var(--hairline); padding-block: 44px 36px; margin-top: 24px; }
  .foot-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 32px; }
  .foot-brand .brand { margin-bottom: 14px; }
  .foot-brand p { margin: 0 0 12px; font-size: 13.5px; color: var(--muted); max-width: 22em; }
  .foot-brand p.small { color: var(--faint); font-size: 12.5px; }
  .foot-col h4 { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); font-weight: 400; margin: 0 0 14px; }
  .foot-col a { display: block; text-decoration: none; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .foot-col a:hover { color: var(--text); }
  .legal { margin-top: 36px; padding-top: 22px; border-top: 1px solid var(--hairline); font-size: 12.5px; color: var(--faint); max-width: 70em; }

  /* ---------- Responsive ---------- */
  @media (max-width: 960px) {
    .hero-grid { grid-template-columns: minmax(0, 1fr); gap: 40px; }
    .features { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .feature:nth-child(3) { border-left: 0; }
    .feature:nth-child(n+3) { border-top: 1px solid var(--hairline); }
    /* Quando le schede vanno a capo, le due griglie diventano un unico riquadro continuo. */
    .features:not(.second) { border-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .features.second { margin-top: 0; border-top: 0; border-top-left-radius: 0; border-top-right-radius: 0; }
    .features.second .feature:nth-child(-n+2) { border-top: 1px solid var(--hairline); }
    .foot-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    .nav-links { display: none; }
    .nav-inner { gap: 12px; }
    .nav-inner .lang { margin-left: auto; }
    .steps { grid-template-columns: minmax(0, 1fr); }
    .release { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    section { padding-block: 40px; }
  }
  @media (max-width: 520px) {
    .brand span { display: none; }
    .back-portfolio span { display: none; }
    .back-portfolio { margin-left: 0; padding: 7px 9px; }
    .features { grid-template-columns: minmax(0, 1fr); }
    .feature { border-left: 0; border-top: 1px solid var(--hairline); }
    .feature:first-child { border-top: 0; }
    .foot-grid { grid-template-columns: minmax(0, 1fr); }
    .nav .btn.primary span.lbl { display: none; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="back-portfolio" id="backBtn" href="/#/ideas" target="_top">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      <span>Portfolio</span>
    </a>
    <span class="back-sep" aria-hidden="true"></span>
    <a class="brand" href="#top">
      <img src="icon-256.png" alt="">
      <span>Takeout Fixer</span>
    </a>
    <nav class="nav-links">
      <a href="#features" data-i18n="navFeatures"></a>
      <a href="#howto" data-i18n="navHowto"></a>
      <a href="#formats" data-i18n="navFormats"></a>
      <a href="#changelog" data-i18n="navChangelog"></a>
      <a href="#faq" data-i18n="navFaq"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="it" aria-pressed="true">IT</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button type="button" class="theme-toggle" id="themeBtn">
      <svg class="i-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1z"/></svg>
      <svg class="i-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.3M8 13.2v1.3M1.5 8h1.3M13.2 8h1.3M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9"/></svg>
    </button>
    <a class="btn primary" href="https://github.com/MEPoss/Google-Photos-Takeout-Fixer/releases/latest">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m0 0L5 7m3 3l3-3M3 13h10"/></svg>
      <span class="lbl" data-i18n="navDownload"></span>
    </a>
  </div>
</header>

<main id="top">

  <!-- Hero -->
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <div class="pill mono">
          <span class="dot"></span>
          <span id="verLabel">v1.2.6</span>
          <span class="tag" data-i18n="tagFree"></span>
        </div>
        <h1 data-i18n="heroTitle"></h1>
        <p class="lede" data-i18n="heroLede"></p>

        <div class="code mono">
          <span class="prompt">$</span>
          <code id="debCmd"><span class="tok-cmd">sudo</span> <span class="tok-sub">apt</span> <span class="tok-sub">install</span> <span class="tok-path">./google-photos-takeout-fixer</span><span class="tok-glob">*</span><span class="tok-path">.deb</span></code>
          <button type="button" id="copyBtn" aria-label="Copy command">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>
            <span id="copyLbl" data-i18n="copy"></span>
          </button>
        </div>

        <div class="cta-row">
          <a class="btn primary" href="https://github.com/MEPoss/Google-Photos-Takeout-Fixer/releases/latest/download/GooglePhotosTakeoutFixer.dmg">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m0 0L5 7m3 3l3-3M3 13h10"/></svg>
            <span data-i18n="btnDmg"></span>
          </a>
          <a class="btn" href="https://github.com/MEPoss/Google-Photos-Takeout-Fixer/releases/latest">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m0 0L5 7m3 3l3-3M3 13h10"/></svg>
            <span data-i18n="btnDeb"></span>

    a2: "<p>Google Takeout doesn't write date, GPS and description inside the photos: it puts them in a separate <code>.json</code> file next to each one. This app reads that JSON and writes the data into the real file, so Preview, Finder and photo libraries show it correctly.</p>",
    q3: "Does it touch my original files?",
    a3: "<p>No: it copies files to the output folder, organized by year/month, and writes the metadata on the copy. Still, keep your original Takeout export until you're happy with the result.</p>",
    q4: "My export is split into several folders (Takeout, Takeout 2, …): do I have to merge them?",
    a4: "<p>No. Extract them all into one folder and point the app there. If Google separated a photo from its JSON by putting them in different parts, the app finds it by searching across folders with the same album name.</p>",
    q5: "Are the Takeout photos the originals I uploaded?",
    a5: "<p>It depends on the quality you chose in Google Photos. With <b>Original quality</b> the file is identical to what you uploaded. With <b>Storage saver</b> (formerly “High quality”) Google recompresses photos above 16 megapixels and videos above 1080p: the exported file is a recompressed version, not the original.</p>",
    q6: "Why are some files reported as “duplicates”?",
    a6: "<p>If a photo belongs to several Google Photos albums, Takeout exports one copy per album. The app recognizes them (same name and size, then an identical SHA-256 hash), keeps one and lists the discarded ones in <code>duplicati.csv</code>. Photos with the same name but different content are both kept.</p>",
    q7: "Is my data sent online?",
    a7: "<p>No. Everything runs locally: exiftool is bundled, the time zone is computed with an offline library, and the small internal server only answers on <code>127.0.0.1</code>. No telemetry, no network calls.</p>",
    q8: "How do I install it?",
    a8: "<p><b>macOS 11+:</b> download the <code>.dmg</code>, drag the app to Applications and, on first launch, right-click → Open (the app is unsigned). <b>Debian 12 and derivatives:</b> download the <code>.deb</code> from the releases page and install it with <code>sudo apt install ./file-name.deb</code>. Details and troubleshooting in the <a href=\"https://github.com/MEPoss/Google-Photos-Takeout-Fixer#faq-e-risoluzione-problemi\">README</a>.</p>",
    footTagline: "Puts date, GPS and description back into photos exported from Google Photos. Free and open source.",
    footBuilt: "Built by Ugo Possenti, an independent developer. Released under the MIT license.",
    footProduct: "Product", footOss: "Open source", footDocs: "Documentation",
    footBug: "Report a bug", footReleases: "Releases", footLicense: "MIT license",

    legal: "Independent project, not affiliated with Google LLC. Google Photos and Google Takeout are trademarks of Google LLC. The software is provided “as is”, without warranty: always keep a copy of your original export until you're happy with the result.",
  },

const META = {
  it: { title: "Google Photos Takeout Fixer — Ripristina data e GPS delle foto di Google Foto", desc: "Ripristina data di scatto, GPS e descrizione nelle foto e nei video esportati da Google Foto con Google Takeout. Gratuito, open source, per macOS e Debian." },
  en: { title: "Google Photos Takeout Fixer — Restore date and GPS in your Google Photos exports", desc: "Restore the real shot date, GPS and description in photos and videos exported from Google Photos with Google Takeout. Free, open source, for macOS and Debian." },
};

let currentLang = "it";

function detectLang() {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q === "it" || q === "en") return q;
  } catch (e) {}
  try {
    const saved = localStorage.getItem("tf-lang");
    if (saved === "it" || saved === "en") return saved;
  } catch (e) {}
  return (navigator.language || "en").toLowerCase().startsWith("it") ? "it" : "en";
}

function applyLang(lang) {
  currentLang = lang;
  const T = I18N[lang];
  updateThemeLabel();
  document.getElementById("backBtn").setAttribute("aria-label", T.backPortfolio);
  document.getElementById("html-root").setAttribute("lang", lang);
  document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T[el.getAttribute("data-i18n")]; });
  document.querySelectorAll("[data-i18n-html]").forEach(function (el) { el.innerHTML = T[el.getAttribute("data-i18n-html")]; });
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
  });
  document.getElementById("shotIt").hidden = lang !== "it";
  document.getElementById("shotEn").hidden = lang !== "en";
  document.title = META[lang].title;
  document.querySelector('meta[name="description"]').setAttribute("content", META[lang].desc);
  try { localStorage.setItem("tf-lang", lang); } catch (e) {}
}

document.querySelectorAll(".lang button").forEach(function (b) {
  b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang")); });
});

document.getElementById("copyBtn").addEventListener("click", function () {
  const text = document.getElementById("debCmd").textContent;
  const done = function () {
    const lbl = document.getElementById("copyLbl");
    lbl.textContent = I18N[currentLang].copied;
    setTimeout(function () { lbl.textContent = I18N[currentLang].copy; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, done);
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta); done();
  }
});


// ---------- Tema chiaro/scuro ----------
const rootEl = document.documentElement;
const darkMQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
let themeSaved = null;
try { const t = localStorage.getItem("tf-theme"); if (t === "light" || t === "dark") themeSaved = t; } catch (e) {}

function effectiveTheme() { return themeSaved || (darkMQ && darkMQ.matches ? "dark" : "light"); }

function updateThemeLabel() {
  const btn = document.getElementById("themeBtn");
  if (!btn) return;
  const label = I18N[currentLang][effectiveTheme() === "dark" ? "themeToLight" : "themeToDark"];
  btn.setAttribute("aria-label", label);
  btn.setAttribute("title", label);
}

function applyTheme(theme) {
  rootEl.setAttribute("data-theme", theme);
  updateThemeLabel();
}

document.getElementById("themeBtn").addEventListener("click", function () {
  themeSaved = effectiveTheme() === "dark" ? "light" : "dark";
  try { localStorage.setItem("tf-theme", themeSaved); } catch (e) {}
  applyTheme(themeSaved);
});

if (darkMQ && darkMQ.addEventListener) {
  darkMQ.addEventListener("change", function () { if (!themeSaved) applyTheme(effectiveTheme()); });
}

applyTheme(effectiveTheme());
applyLang(detectLang());

// ---------- Modalità incorporata (pagina dentro un iframe del portfolio) ----------
(function () {
  let embedded = false;
  try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
  if (!embedded) return;
  rootEl.classList.add("embedded");

  // GitHub rifiuta di essere mostrato in un iframe: i link esterni si aprono in una nuova scheda.
  document.addEventListener("click", function (e) {
    const a = e.target.closest && e.target.closest('a[href^="http"]');
    if (!a) return;
    e.preventDefault();
    window.open(a.href, "_blank", "noopener");
  });

  // "Portfolio": cambia solo l'hash della finestra principale, senza ricaricare il sito.
  document.getElementById("backBtn").addEventListener("click", function (e) {
    try { window.top.location.hash = "#/ideas"; e.preventDefault(); } catch (err) {}
  });

  // Il tema lo decide il sito che ospita la pagina (stessa origine): il toggle interno
  // aziona quello del sito e poi ne segue lo stato, così la scelta resta valida anche tornando indietro.
  document.addEventListener("click", function (e) {
    if (!(e.target.closest && e.target.closest("#themeBtn"))) return;
    let hostToggle = null;
    try { hostToggle = window.parent.document.getElementById("theme-toggle"); } catch (err) {}
    if (!hostToggle) return;
    e.stopPropagation();
    hostToggle.click();
  }, true);

  try {
    const parentRoot = window.parent.document.documentElement;
    const sync = function () {
      const t = parentRoot.getAttribute("data-theme");
      themeSaved = (t === "light" || t === "dark") ? t : null;
      applyTheme(effectiveTheme());
    };
    sync();
    new MutationObserver(sync).observe(parentRoot, { attributes: true, attributeFilter: ["data-theme"] });
  } catch (e) {}
})();

// Mostra la versione realmente più recente (se l'API risponde), altrimenti resta quella scritta nel markup.
fetch("https://api.github.com/repos/" + REPO + "/releases/latest")
  .then(function (r) { return r.ok ? r.json() : null; })
  .then(function (d) { if (d && d.tag_name) document.getElementById("verLabel").textContent = d.tag_name; })
  .catch(function () {});
</script>
